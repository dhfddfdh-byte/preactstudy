<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0B1F33">
<title>Pre-ACT Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;700&family=Big+Shoulders+Display:wght@600;700;800;900&display=swap" rel="stylesheet">
<script>(function(){try{var t=localStorage.getItem('preact608.theme');if(t)document.documentElement.dataset.theme=t}catch(e){}})();</script>
<style>
/* ============ tokens: Chicago flag — sky-blue stripes, four red stars ============ */
:root{
  --bg:#F2F7FB; --surface:#FFFFFF; --surface-2:#EAF2F9; --sunk:#E1EBF3;
  --ink:#0B1F33; --ink-2:#22384F; --muted:#5A6D80; --line:#D6E3ED; --line-2:#BACCDB;
  --sky:#5BB1E4; --sky-2:#DCEFFA; --star:#E4002B; --star-soft:#FDE6EA;
  --btn:#0B1F33; --on-btn:#FFFFFF;
  --english:#2F6FDB; --math:#E35A26; --reading:#0F9369; --science:#7A4DE0;
  --right:#14924F; --right-soft:#E2F5EA; --wrong:#D42A43; --wrong-soft:#FCE8EB; --flag:#F5B400; --flag-soft:#FFF5D1;
  --page:#FFFFFF; --page-filter:none; --hl:rgba(255,214,10,.45); --hl-blend:multiply;
  --shadow:0 1px 0 rgba(11,31,51,.05);
  --display:"Big Shoulders Display","Libre Franklin",system-ui,sans-serif;
  --text:"Libre Franklin",system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root[data-theme="dark"]{
  --bg:#07121E; --surface:#0E1D2D; --surface-2:#13263A; --sunk:#0A1826;
  --ink:#EAF3FA; --ink-2:#C5D6E5; --muted:#8CA2B6; --line:#1E3349; --line-2:#2C4560;
  --sky:#6EC1F0; --sky-2:#123049; --star:#FF4A68; --star-soft:#3A1520;
  --btn:#EAF3FA; --on-btn:#07121E;
  --english:#6B9CFF; --math:#FF8A5B; --reading:#3DCB97; --science:#A688FF;
  --right:#3DCB7F; --right-soft:#11301F; --wrong:#FF6B7F; --wrong-soft:#3A1520; --flag:#FFCB3D; --flag-soft:#3A3013;
  --page:#1B1B1B; --page-filter:invert(.9) hue-rotate(180deg) brightness(1.06); --hl:rgba(255,214,10,.38); --hl-blend:screen;
  --shadow:0 1px 0 rgba(0,0,0,.25),0 14px 36px -18px rgba(0,0,0,.7);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#07121E; --surface:#0E1D2D; --surface-2:#13263A; --sunk:#0A1826;
  --ink:#EAF3FA; --ink-2:#C5D6E5; --muted:#8CA2B6; --line:#1E3349; --line-2:#2C4560;
  --sky:#6EC1F0; --sky-2:#123049; --star:#FF4A68; --star-soft:#3A1520;
  --btn:#EAF3FA; --on-btn:#07121E;
  --english:#6B9CFF; --math:#FF8A5B; --reading:#3DCB97; --science:#A688FF;
  --right:#3DCB7F; --right-soft:#11301F; --wrong:#FF6B7F; --wrong-soft:#3A1520; --flag:#FFCB3D; --flag-soft:#3A3013;
  --page:#1B1B1B; --page-filter:invert(.9) hue-rotate(180deg) brightness(1.06); --hl:rgba(255,214,10,.38); --hl-blend:screen;
  --shadow:0 1px 0 rgba(0,0,0,.25),0 14px 36px -18px rgba(0,0,0,.7);
}}

/* ============ base ============ */
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--text);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
a{color:var(--english)}
:focus-visible{outline:2.5px solid var(--sky);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;line-height:1;letter-spacing:.005em}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-feature-settings:"tnum";font-weight:800}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.st{width:22px;height:22px;flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line-2);
  background:var(--surface);color:var(--ink);font-weight:700;font-size:.95rem;cursor:pointer;white-space:nowrap;line-height:1;transition:transform .08s}
.btn:hover{border-color:var(--ink-2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--btn);border-color:var(--btn);color:var(--on-btn)}
.btn.pri:hover{box-shadow:0 0 0 3px var(--sky-2)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.sm{min-height:34px;padding:0 14px;font-size:.86rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.iconbtn{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;border:1.5px solid var(--line-2);background:var(--surface);cursor:pointer;color:var(--ink);font-weight:700;font-size:1.1rem}
.iconbtn:hover{border-color:var(--ink-2)}


/* ============ home ============ */
.appbar{background:var(--surface)}
.appbar .in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:14px 24px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:900;font-size:1.6rem;line-height:1}
.logo svg.st{width:26px;height:26px;color:var(--star)}
.appbar .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:999px;background:var(--surface-2);border:0;font-size:.88rem;color:var(--muted);cursor:pointer}
.chip .d{width:8px;height:8px;border-radius:50%;background:var(--wrong)}
.chip.ok .d{background:var(--right)}
.chip b{color:var(--ink)}
@media (max-width:420px){.chip .w{display:none}}
svg.st.off{color:transparent;stroke:var(--star);stroke-width:1.1;stroke-linejoin:round}
svg.st.on{color:var(--star)}

/* the flag: two sky stripes, a white band of four stars — your four sections */
.flag{background:var(--surface);border-bottom:1px solid var(--line)}
.flag .stripe{height:clamp(14px,2.4vw,28px);background:var(--sky)}
.flag .in{max-width:1200px;margin:0 auto;padding:0 24px}
.flag .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:18px 0}
.flag .hello{font-family:var(--display);font-weight:800;font-size:1.6rem}
.flag .ttl{display:block;font-family:var(--display);font-weight:900;font-size:clamp(2.4rem,5vw,3.6rem);line-height:1}
.flag .goal{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.flag .goal b{font-family:var(--display);font-size:1.5rem;font-weight:800}
.flag .goal .togo{color:var(--muted);font-size:.92rem}
.flag .mid{display:grid;grid-template-columns:minmax(200px,auto) 1fr;gap:clamp(20px,5vw,72px);align-items:center;padding:clamp(22px,4vw,44px) 0}
.flag .comp .lab{font-weight:700;color:var(--muted)}
.flag .comp .big{font-family:var(--display);font-weight:900;font-size:clamp(6.5rem,13vw,10rem);line-height:.8;margin-top:6px}
.flag .comp .none{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,2.6vw,1.9rem);line-height:1.05;margin:10px 0 0;max-width:14ch}
.flag .four{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.flag .s4{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.flag .s4 svg.st{width:clamp(52px,8vw,92px);height:clamp(52px,8vw,92px);margin-bottom:6px}
.flag .s4 .nm{font-weight:700;font-size:.92rem;display:flex;align-items:center;gap:6px}
.flag .s4 .nm i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.flag .s4 .v{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1}
.flag .s4 .v.none{color:var(--line-2)}
.flag .s4 .bm{font-size:.76rem;color:var(--muted)}
.flag .bot{display:flex;gap:10px 28px;flex-wrap:wrap;padding:14px 0 16px;color:var(--muted);font-size:.9rem}
.flag .bot b{font-family:var(--display);font-weight:800;font-size:1.35rem;color:var(--ink);margin-right:4px}

.wrap{max-width:1200px;margin:0 auto;padding:32px 24px 80px}
.setup{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center;padding:32px;border-radius:24px;background:var(--surface);border:1px solid var(--line);margin-bottom:32px}
.setup h1{font-size:clamp(2.6rem,6vw,4.2rem);font-weight:900;margin-bottom:14px}
.setup p{color:var(--muted);margin:0 0 8px;max-width:52ch}
.drop{border:2px dashed var(--line-2);border-radius:20px;padding:36px 20px;text-align:center;cursor:pointer;background:var(--surface-2);transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--sky);background:var(--sky-2)}
.drop svg.i{width:36px;height:36px;color:var(--ink);margin-bottom:8px}
.drop b{display:block;font-size:1.05rem}
.drop span{color:var(--muted);font-size:.9rem}

.resume{display:flex;align-items:center;gap:16px;padding:14px 16px 14px 14px;border-radius:999px;background:var(--ink);color:var(--surface);margin-bottom:32px;flex-wrap:wrap}
.resume .ring{width:50px;height:50px;border-radius:50%;background:conic-gradient(var(--sc) calc(var(--p)*1%),rgba(255,255,255,.15) 0);display:grid;place-items:center;flex:none}
.resume .ring span{width:38px;height:38px;border-radius:50%;background:var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:800}
.resume .tx{flex:1;min-width:180px}
.resume .tx b{font-family:var(--display);font-size:1.35rem;font-weight:800}
.resume .tx div{opacity:.75;font-size:.9rem}
.resume .btn.pri{background:var(--surface);color:var(--ink);border-color:var(--surface)}
.resume .btn.ghost{color:var(--surface);opacity:.8}
.resume .btn.ghost:hover{background:rgba(255,255,255,.1)}

.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:0 0 6px;flex-wrap:wrap}
.sh h2{font-size:2.6rem;font-weight:900}
.sh p{margin:0;color:var(--muted);font-size:.92rem}
.runs{border-top:3px solid var(--ink);margin-bottom:48px}
.run{display:grid;grid-template-columns:8px minmax(170px,1.1fr) minmax(190px,1fr) 150px auto;gap:22px;align-items:center;padding:20px 0;border-bottom:1px solid var(--line)}
.run .bar{align-self:stretch;border-radius:4px;background:var(--c)}
.run.full .bar{background:linear-gradient(var(--english) 0 25%,var(--math) 25% 50%,var(--reading) 50% 75%,var(--science) 75%)}
.run h3{font-size:2.5rem;font-weight:900;color:var(--c)}
.run.full h3{color:var(--ink)}
.run .meta{color:var(--muted);font-size:.88rem;margin-top:6px}
.run .redo{margin-top:8px;border:0;background:none;padding:0;color:var(--ink-2);font-weight:700;font-size:.86rem;cursor:pointer;text-decoration:underline;text-decoration-color:var(--c);text-decoration-thickness:2px;text-underline-offset:4px}
.run .nums{display:flex;gap:22px}
.run .nums div{font-size:.78rem;color:var(--muted)}
.run .nums b{display:block;font-family:var(--display);font-weight:800;font-size:2rem;color:var(--ink);line-height:1}
.run .spark svg{width:150px;height:44px;display:block}
.run .spark span{font-size:.76rem;color:var(--muted)}
.run .acts{display:flex;gap:8px}
.twocol{display:grid;grid-template-columns:1.25fr 1fr;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px}
.card > h2{font-size:1.9rem;padding:20px 22px 0}
.card > .sub{color:var(--muted);font-size:.88rem;padding:6px 22px 0;margin:0}
.ladder{padding:22px 28px 24px}
.ladder .axis,.ladder .row{display:grid;grid-template-columns:86px 1fr 54px;gap:14px;align-items:center}
.ladder .axis{margin-bottom:6px}
.ladder .axis .t{position:relative;height:16px}
.ladder .axis .t span{position:absolute;transform:translateX(-50%);font-size:.72rem;color:var(--muted);font-weight:700}
.ladder .row{padding:11px 0;border-top:1px dashed var(--line)}
.ladder .row:first-of-type{border-top:0}
.ladder .nm{font-weight:700;display:flex;align-items:center;gap:8px}
.ladder .nm i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.track{position:relative;height:12px;border-radius:6px;background:var(--surface-2)}
.track .fill{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--c);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.track .bm{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink);border-radius:1px}
.track .gl{position:absolute;top:-10px;bottom:-10px;width:0;border-left:2px dashed var(--star)}
.ladder .v{font-family:var(--display);font-weight:800;font-size:1.9rem;text-align:right;line-height:1}
.ladder .v.none{font-size:1rem;color:var(--muted);font-family:var(--text);font-weight:400}
.ladder .key{display:flex;gap:16px;margin-top:12px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.ladder .key i{display:inline-block;vertical-align:-2px;margin-right:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;border:1.5px dashed var(--line-2);display:inline-block}
.hist{list-style:none;margin:8px 0 0;padding:0 0 8px}
.hist li{display:flex;align-items:center;gap:12px;padding:12px 22px;border-top:1px solid var(--line)}
.hist .sw{width:6px;height:38px;border-radius:3px;background:var(--c);flex:none}
.hist .tx{flex:1;min-width:0}
.hist .tx b{display:block}
.hist .tx span{color:var(--muted);font-size:.84rem}
.hist .v{font-family:var(--display);font-weight:800;font-size:1.9rem;min-width:2ch;text-align:right;line-height:1}
.empty{padding:12px 22px 24px;color:var(--muted)}
.foot{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:32px;color:var(--muted);font-size:.86rem}

/* ============ test ============ */
#test{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;background:var(--bg);z-index:40}
.tb{background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.tb .row1{display:flex;align-items:center;gap:10px;padding:10px 14px 8px;min-height:60px}
.secpill{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 10px;border-radius:999px;background:color-mix(in srgb,var(--sc) 14%,var(--surface));color:var(--sc);font-family:var(--display);font-weight:800;font-size:1.3rem;white-space:nowrap}
.secpill i{width:10px;height:10px;border-radius:50%;background:var(--sc)}
.tb .qof{color:var(--muted);font-size:.9rem;white-space:nowrap}
.tb .sp{flex:1}
.tbtn{height:40px;display:inline-flex;align-items:center;gap:8px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:.9rem;cursor:pointer;white-space:nowrap;color:var(--ink)}
.tbtn:hover{border-color:var(--ink-2)}
.tbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.clock{display:flex;align-items:baseline;gap:8px;cursor:pointer;border:0;background:var(--surface-2);color:inherit;padding:0 14px;height:40px;border-radius:999px}
.clock .t{font-family:var(--display);font-variant-numeric:tabular-nums;font-feature-settings:"tnum";font-weight:800;font-size:1.7rem;line-height:40px}
.clock .s{font-size:.78rem;color:var(--muted);white-space:nowrap}
.clock .s.warn{color:var(--wrong);font-weight:700}
.clock.hid .t{font-size:.95rem;font-family:var(--text);font-weight:700}
.prog{display:flex;gap:2px;padding:0 14px 10px;height:16px}
.prog span{flex:1;border-radius:2px;background:var(--line);position:relative}
.prog span.a{background:var(--sc)}
.prog span.f::after{content:"";position:absolute;left:0;right:0;top:-4px;height:3px;border-radius:2px;background:var(--flag)}
.prog span.cur{box-shadow:0 0 0 1.5px var(--ink)}
.prog span.r{background:var(--right)}
.prog span.w{background:var(--wrong)}
.prog span.ghost{opacity:.25}
.tbar-time{height:3px;background:var(--surface-2)}
.tbar-time i{display:block;height:100%;width:0;background:var(--sky);transition:width .5s linear}

.menu{position:fixed;z-index:60;width:310px;max-width:calc(100vw - 16px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:8px}
.menu button.mi{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;background:none;border-radius:12px;cursor:pointer;text-align:left;font-weight:700;font-size:.95rem}
.menu button.mi:hover{background:var(--surface-2)}
.menu button.mi small{display:block;font-weight:400;color:var(--muted);font-size:.8rem;line-height:1.3}
.menu .tg{margin-left:auto;width:38px;height:22px;border-radius:11px;background:var(--line-2);position:relative;flex:none;transition:background .15s}
.menu .tg::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:left .15s}
.menu [aria-checked="true"] .tg{background:var(--sky)}
.menu [aria-checked="true"] .tg::after{left:19px}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.menu .size{display:flex;align-items:center;gap:8px;padding:6px 12px}
.menu .size span{flex:1;font-weight:700;font-size:.95rem}

.stage{position:relative;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.stage.single{grid-template-columns:minmax(0,1fr)}
.pane{min-height:0;overflow:auto;position:relative;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.ppane{background:var(--surface-2);border-right:1px solid var(--line)}
.stage.single .ppane{display:none}
.pin{padding:26px 26px 90px;display:flex;flex-direction:column;align-items:center}
.paper{background:var(--page);padding:16px 14px;border-radius:16px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center}
.crop{position:relative;background:var(--page);flex:none}
.crop canvas{display:block;width:100%;height:100%;filter:var(--page-filter)}
.hl-l{position:absolute;inset:0}
.hl{position:absolute;background:var(--hl);mix-blend-mode:var(--hl-blend);border-radius:2px}
.hlmode .hl-l{cursor:text;touch-action:none}
.hlmode .hl{cursor:pointer}
.refbox{position:absolute;border:2px solid var(--sc);border-radius:6px;background:color-mix(in srgb,var(--sc) 18%,transparent);pointer-events:none}
.qpane{background:var(--surface)}
.qin{padding:24px 28px 90px;margin:0 auto;max-width:700px}
.stage.single .qin{max-width:780px}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.qhead h2{font-size:2rem;font-weight:800}
.qhead h2 small{font-family:var(--text);font-size:.9rem;color:var(--muted);font-weight:400;margin-left:6px}
.flagbtn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:700;font-size:.86rem;color:var(--muted)}
.flagbtn svg.i{width:17px;height:17px}
.flagbtn[aria-pressed="true"]{background:var(--flag-soft);border-color:var(--flag);color:var(--ink)}
.flagbtn[aria-pressed="true"] svg{fill:var(--flag);stroke:var(--ink)}
.qhead .tags{display:flex;gap:8px}
.xbtn{display:none!important}
.xbtn[aria-pressed="true"]{background:var(--wrong-soft);border-color:var(--wrong);color:var(--wrong)}
.stem{margin-bottom:20px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:stretch;border:1.5px solid var(--line);border-radius:16px;background:var(--page);position:relative;transition:border-color .12s,box-shadow .12s,transform .08s}
.opt:hover{border-color:var(--line-2)}
.opt .pick{flex:1;display:flex;align-items:center;gap:14px;padding:12px 8px 12px 14px;background:none;border:0;cursor:pointer;text-align:left;min-width:0}
.radio{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-2);flex:none;background:var(--surface);transition:all .12s}
.opt .elim{width:46px;flex:none;border:0;border-left:1px solid var(--line);background:none;cursor:pointer;color:var(--muted);display:grid;place-items:center;border-radius:0 15px 15px 0}
.opt .elim:hover{color:var(--wrong);background:var(--wrong-soft)}

  return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`}
function hm(ms){const m=Math.round(ms/6e4);return m<60?`${m}m`:`${Math.floor(m/60)}h ${m%60}m`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function when(t){const d=new Date(t);return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+', '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}

(()=>{let d='';for(let i=0;i<12;i++){const a=-Math.PI/2+i*Math.PI/6,r=i%2?4.9:11.5;d+=(i?'L':'M')+(Math.cos(a)*r).toFixed(2)+','+(Math.sin(a)*r).toFixed(2)}$('#starPath').setAttribute('d',d+'Z')})();

/* ============ PDF: the booklet stays on this device; questions are drawn piece by piece ============ */
let pdfjs=null,pdfDoc=null,bookBuf=null;
async function lib(){
  if(pdfjs)return pdfjs;
  pdfjs=await import(PDFJS);
  try{const b=new Blob([`import ${JSON.stringify(PDFJS_WORKER)};`],{type:'text/javascript'});pdfjs.GlobalWorkerOptions.workerPort=new Worker(URL.createObjectURL(b),{type:'module'})}
  catch(e){pdfjs.GlobalWorkerOptions.workerSrc=PDFJS_WORKER}
  return pdfjs;
}
async function doc(){
  if(pdfDoc)return pdfDoc;
  if(!bookBuf)bookBuf=await idbGet('booklet').catch(()=>null);
  if(!bookBuf)return null;
  const L=await lib();pdfDoc=await L.getDocument({data:new Uint8Array(bookBuf.slice(0))}).promise;return pdfDoc;
}
const pageCache={};
const getPage=p=>pageCache[p]||(pageCache[p]=pdfDoc.getPage(p));
async function drawRect(canvas,p,r,scale){
  const dpr=Math.min(window.devicePixelRatio||1,3),s=scale*dpr;
  const w=Math.max(1,Math.round((r[2]-r[0])*s)),h=Math.max(1,Math.round((r[3]-r[1])*s));
  const page=await getPage(p),vp=page.getViewport({scale:s,offsetX:-r[0]*s,offsetY:-r[1]*s});
  const tmp=document.createElement('canvas');tmp.width=w;tmp.height=h;
  const ctx=tmp.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
  await page.render({canvas:tmp,canvasContext:ctx,viewport:vp}).promise;
  canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(tmp,0,0);
}
async function initBook(){bookBuf=await idbGet('booklet').catch(()=>null);paintChip()}
function paintChip(){$('#bookChip').classList.toggle('ok',!!bookBuf);$('#bookTxt').innerHTML=bookBuf?'<b>Booklet<span class="w"> ready</span></b>':'No booklet';$('#bookChip').title=bookBuf?'Replace the booklet PDF':'Open your booklet PDF'}
$('#bookChip').onclick=()=>$('#fileIn').click();
$('#fileIn').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)takeFile(f)};
async function takeFile(f){
  if(!/pdf$/i.test(f.type)&&!/\.pdf$/i.test(f.name)){toast('That’s not a PDF. Pick the Form 608 booklet.');return}
  const buf=await f.arrayBuffer();toast('Opening booklet…');
  try{const L=await lib(),task=L.getDocument({data:new Uint8Array(buf.slice(0))}),d=await task.promise,n=d.numPages;task.destroy();
    if(n!==BOOKLET_PAGES&&!await ask('This might not be Form 608',`The Form 608 booklet has ${BOOKLET_PAGES} pages; this file has ${n}. Questions won’t line up with the answer key.`,'Use it anyway','Cancel'))return;
  }catch(err){console.error(err);toast('Couldn’t open that PDF. Check your internet connection and try again.');return}
  await idbPut('booklet',buf);await idbPut('bookletInfo',{name:f.name,at:Date.now()});
  bookBuf=buf;pdfDoc=null;for(const k in pageCache)delete pageCache[k];
  paintChip();toast('Booklet saved on this device');
  if(view==='home')renderHome();
  if(pending){const p=pending;pending=null;startSession(...p)}
}

/* ============ SCORES ============ */
const scored=()=>store.history.filter(h=>!h.drill);
function latest(){const o={};for(const h of scored())for(const s of ORDER)if(h.secs[s]&&o[s]==null)o[s]=h.secs[s].scale;return o}
function best(){const o={};for(const h of scored())for(const s of ORDER)if(h.secs[s])o[s]=Math.max(o[s]||0,h.secs[s].scale);return o}
function tries(s){return scored().filter(h=>h.secs[s]).length}
function missedLatest(s){const h=scored().find(x=>x.secs[s]);if(!h)return[];return range(1,SECTIONS[s].n).filter(q=>h.secs[s].ans[q]!==key(s,q))}
function stats(){
  let ans=0,right=0,ms=0;const days=new Set();
  for(const h of store.history){ms+=h.totalMs;days.add(new Date(h.finishedAt).toDateString());
    for(const s in h.secs){const x=h.secs[s];const qs=h.drill?h.drill:range(1,SECTIONS[s].n);for(const q of qs){if(x.ans[q]){ans++;if(x.ans[q]===key(s,q))right++}}}}
  let streak=0;const d=new Date();if(!days.has(d.toDateString()))d.setDate(d.getDate()-1);
  while(days.has(d.toDateString())){streak++;d.setDate(d.getDate()-1)}
  return{ans,acc:ans?Math.round(right/ans*100):null,ms,streak};
}

const starSvg=on=>`<svg class="st ${on?'on':'off'}" aria-hidden="true"><use href="#star"/></svg>`;

function spark(s){
  const pts=[...scored()].reverse().filter(h=>h.secs[s]).map(h=>h.secs[s].scale);
  if(!pts.length)return `<span>No tries yet</span>`;
  const W=150,H=44,x=i=>pts.length===1?W/2:4+i*(W-8)/(pts.length-1),y=v=>4+(35-v)/34*(H-8),c=css('--'+s);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${SECTIONS[s].name} scores over time">
    <line x1="0" x2="${W}" y1="${y(BENCH[s])}" y2="${y(BENCH[s])}" stroke="${css('--line-2')}" stroke-dasharray="3 3"/>
    ${pts.length>1?`<path d="${pts.map((v,i)=>`${i?'L':'M'}${x(i)},${y(v)}`).join('')}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`:''}
    <circle cx="${x(pts.length-1)}" cy="${y(pts[pts.length-1])}" r="4" fill="${c}"/></svg>`;
}

/* ============ SESSION + TIMER ============ */
let A=null,R=null;   // A: active attempt; R: review {hist,sec,q}
let running=false,tickBase=0,ticker=null,lastSave=0;
const newSec=q=>({ans:{},cross:{},flags:{},checked:{},q,ms:0});
async function startSession(kind,mode,drill){
  if(!bookBuf){pending=[kind,mode,drill];if(await ask('Open your booklet first','Pick the Form 608 booklet PDF. It stays on this device.','Choose PDF','Cancel'))$('#fileIn').click();else pending=null;return}
  if(store.active&&!await ask('Replace your paused session?','Starting a new session discards the paused one.','Start new','Cancel'))return;
  const order=kind==='full'?[...ORDER]:[kind];
  store.active={id:'a'+Date.now().toString(36),kind,mode,order,cur:0,phase:'intro',startedAt:Date.now(),totalMs:0,drill:drill||null,
    sec:Object.fromEntries(order.map(s=>[s,newSec(drill?drill[0]:1)])),hl:{},calc:null,timeUp:{}};
  save();resume();
}
async function resume(){A=store.active;R=null;show('test');setChrome();if(!await ensureDoc())return;if(A.phase!=='test')return sectionIntro();renderQ(true);pauseCover()}
async function ensureDoc(){
  coverHTML(`<div class="box"><p>Opening booklet…</p></div>`);
  try{if(await doc()){$('#cover').hidden=true;return true}}catch(e){console.error(e)}
  coverHTML(`<div class="box"><h2>Booklet didn’t open</h2><p>The viewer loads from the internet. Check your connection and try again. Your answers are saved.</p>
    <div class="acts"><button class="btn pri" id="cRetry">Try again</button><button class="btn" id="cHome">Go home</button></div></div>`);
  $('#cRetry').onclick=()=>{pdfDoc=null;R?openReview(R.hist,R.sec,R.q):resume()};$('#cHome').onclick=goHome;return false;
}
const sec=()=>R?R.sec:A.order[A.cur];
const st=()=>A.sec[sec()];
const curQ=()=>R?R.q:st().q;
const qlist=()=>{const d=R?R.hist.drill:A.drill;return d||range(1,SECTIONS[sec()].n)};
function play(){if(running||R)return;running=true;tickBase=performance.now();$('#cover').hidden=true;ticker=setInterval(tick,250);tick()}
function stopClock(){if(!running)return;acc();running=false;clearInterval(ticker);save()}
function acc(){const n=performance.now(),d=n-tickBase;tickBase=n;A.totalMs+=d;st().ms+=d}
function tick(){if(!running)return;acc();drawClock();
  if(performance.now()-lastSave>5000){lastSave=performance.now();save()}
  const s=sec();if(A.mode==='timed'&&st().ms>=SECTIONS[s].min*6e4&&!A.timeUp[s]){A.timeUp[s]=1;timeUp()}}
function drawClock(){
  $('#clock').classList.toggle('hid',prefs.timerHidden&&!R);
  if(R){$('#tEl').textContent=fmt(R.hist.secs[R.sec].ms);$('#tLeft').textContent='you took';$('#timeFill').style.width='0';return}
  const s=sec(),lim=SECTIONS[s].min*6e4,left=lim-st().ms,L=$('#tLeft');

    if(e.target.classList.contains('hl')){H[p].splice(+e.target.dataset.i,1);repaintHl(p);saveSoon();return}
    const B=L.getBoundingClientRect(),x0=e.clientX-B.left,y0=e.clientY-B.top;
    const box=document.createElement('div');box.className='hl';L.appendChild(box);
    const mv=ev=>{const x1=ev.clientX-B.left,y1=ev.clientY-B.top;box.style.left=Math.min(x0,x1)+'px';box.style.top=Math.min(y0,y1)+'px';box.style.width=Math.abs(x1-x0)+'px';box.style.height=Math.max(Math.abs(y1-y0),10*s)+'px'};
    const up=ev=>{L.removeEventListener('pointermove',mv);L.removeEventListener('pointerup',up);
      const x1=ev.clientX-B.left,y1=ev.clientY-B.top;
      if(Math.abs(x1-x0)>6){const hh=Math.max(Math.abs(y1-y0),10*s);
        (H[p]||(H[p]=[])).push([+(r[0]+Math.min(x0,x1)/s).toFixed(1),+(r[1]+Math.min(y0,y1)/s).toFixed(1),+(Math.abs(x1-x0)/s).toFixed(1),+(hh/s).toFixed(1)]);saveSoon()}
      repaintHl(p)};
    L.setPointerCapture(e.pointerId);L.addEventListener('pointermove',mv);L.addEventListener('pointerup',up);
  });
}
let lrY=200;const LRH=64;
function toggleLR(){lrOn=!lrOn;$('#lr').hidden=!lrOn;if(lrOn){if(hlOn)setHl(false);lrY=$('#stage').clientHeight*.4;placeLR()}paintToolsBtn()}
function placeLR(){const H=$('#stage').clientHeight;lrY=Math.max(0,Math.min(H-LRH,lrY));$('#lrTop').style.cssText=`top:0;height:${lrY}px`;$('#lrBand').style.cssText=`top:${lrY}px;height:${LRH}px`;$('#lrBot').style.cssText=`top:${lrY+LRH}px;bottom:0`}
$('#stage').addEventListener('pointermove',e=>{if(!lrOn||e.pointerType!=='mouse')return;const B=$('#stage').getBoundingClientRect();lrY=e.clientY-B.top-LRH/2;placeLR()});
$('#lrBand').addEventListener('pointerdown',e=>{const B=$('#stage').getBoundingClientRect(),off=e.clientY-B.top-lrY;$('#lrBand').setPointerCapture(e.pointerId);
  const mv=ev=>{lrY=ev.clientY-B.top-off;placeLR()},up=()=>{$('#lrBand').removeEventListener('pointermove',mv);$('#lrBand').removeEventListener('pointerup',up)};
  $('#lrBand').addEventListener('pointermove',mv);$('#lrBand').addEventListener('pointerup',up)});
/* Desmos */
let calc=null,desmosP=null;
function loadDesmos(){if(window.Desmos)return Promise.resolve(true);if(desmosP)return desmosP;
  desmosP=(async()=>{for(const v of DESMOS_VERSIONS){const ok=await new Promise(res=>{const s=document.createElement('script');s.src=`https://www.desmos.com/api/v${v}/calculator.js?apiKey=${DESMOS_KEY}`;s.onload=()=>res(!!window.Desmos);s.onerror=()=>{s.remove();res(false)};document.head.appendChild(s)});if(ok)return true}return false})();return desmosP}
async function openCalc(){
  $('#calc').hidden=false;$('#calcBtn').setAttribute('aria-pressed','true');if(calc)return;
  const B=$('#calcBody');B.innerHTML='<div class="cfail">Loading Desmos…</div>';
  if(!await loadDesmos()){desmosP=null;B.innerHTML=`<div class="cfail">Desmos didn’t load. It needs an internet connection.<br><br><a href="https://www.desmos.com/calculator" target="_blank" rel="noopener">Open Desmos in a new tab</a></div>`;return}
  B.innerHTML='<div id="calcEl"></div>';
  calc=Desmos.GraphingCalculator($('#calcEl'),{keypad:true,expressions:true,settingsMenu:true,zoomButtons:true,border:false});
  if(A?.calc&&!R){try{calc.setState(A.calc)}catch(e){}}
}
function saveCalc(){if(calc&&A&&!R){try{A.calc=calc.getState()}catch(e){}}}
function closeCalc(destroy){saveCalc();if($('#calc').contains(document.activeElement))document.activeElement.blur();$('#calc').hidden=true;$('#calcBtn').setAttribute('aria-pressed','false');if(destroy&&calc){try{calc.destroy()}catch(e){}calc=null;$('#calcBody').innerHTML=''}if(A)saveSoon()}
$('#calcBtn').onclick=()=>$('#calc').hidden?openCalc():closeCalc(false);
$('#calcClose').onclick=()=>closeCalc(false);
(()=>{const box=$('#calc'),hd=$('#calcHead');
  hd.addEventListener('pointerdown',e=>{if(e.target.closest('button')||MOBILE())return;const sx=e.clientX,sy=e.clientY,ox=box.offsetLeft,oy=box.offsetTop;hd.setPointerCapture(e.pointerId);
    const mv=ev=>{const P=box.parentElement.getBoundingClientRect();box.style.left=Math.min(P.width-80,Math.max(0,ox+ev.clientX-sx))+'px';box.style.top=Math.min(P.height-40,Math.max(0,oy+ev.clientY-sy))+'px'};
    const up=()=>{hd.removeEventListener('pointermove',mv);hd.removeEventListener('pointerup',up)};hd.addEventListener('pointermove',mv);hd.addEventListener('pointerup',up)});
  new ResizeObserver(()=>{if(calc)calc.resize()}).observe(box)})();
let rzT,lastW=innerWidth;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{
  if(view==='test'&&(A?.phase==='test'||R)&&Math.abs(innerWidth-lastW)>2){lastW=innerWidth;curPassage=null;renderQ(false)}if(lrOn)placeLR()},180)});

/* ============ RESULTS ============ */
function countUp(el,to){if(RM()||!to){el.textContent=to;return}const t0=performance.now(),d=900;
  const f=t=>{const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);el.textContent=Math.round(e*to);if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
function showResults(id,focus,fresh){
  const h=store.history.find(x=>x.id===id);if(!h){goHome();return}
  R=null;show('results');
  const secs=ORDER.filter(s=>h.secs[s]);let tab=focus&&h.secs[focus]?focus:secs[0],filter='all';
  const P=$('#results');
  const title=h.drill?`${SECTIONS[secs[0]].name}: missed questions`:(h.kind==='full'?'Full test':SECTIONS[h.kind].name);
  const big=h.drill?null:(h.composite??h.secs[secs[0]].scale);
  const bigLab=h.drill?'':(h.composite!=null?'Composite':`${SECTIONS[secs[0]].name} scale score`);
  const vals={};secs.forEach(s=>vals[s]=h.secs[s].scale);if(h.stem!=null)vals.stem=h.stem;
  const L={};secs.forEach(s=>L[s]=h.secs[s].scale);
  const drillRight=h.drill?h.secs[secs[0]].drillRight:0;
  const head=`<span><span class="ttl">${title}</span><span style="display:block;color:var(--muted);font-size:.9rem;margin-top:4px">${h.mode==='timed'?'Timed':'Practice'}, ${when(h.finishedAt)}. Total ${fmt(h.totalMs)}.</span></span><button class="btn" id="rHome">Back to home</button>`;
  P.innerHTML=(h.drill
    ?`<section class="flag"><div class="in"><div class="top">${head}</div></div><div class="stripe"></div>
        <div class="in"><div class="mid"><div class="comp"><div class="lab">Right this time</div><div class="big num"><span id="bigN">${drillRight}</span><span style="color:var(--line-2)">/${h.drill.length}</span></div></div>
        <p style="color:var(--muted);max-width:46ch;margin:0">${drillRight===h.drill.length?'Every question you missed before, you got this time.':`${h.drill.length-drillRight} still to lock in. Look at them below, then run the drill again from home.`}</p></div></div><div class="stripe"></div></section>`
    :flagHTML({top:head,lab:bigLab,big,L,secs,bot:h.stem!=null?`<span><b>${h.stem}</b>STEM</span>`:''}))+`
  <main class="rbody">
    <div class="rtabs">${secs.length>1?secs.map(s=>`<button class="btn sm" data-tab="${s}">${SECTIONS[s].name} ${h.secs[s].scale}</button>`).join(''):''}<span class="sp"></span>
      ${h.drill?'':'<button class="btn sm" data-f="all">All</button><button class="btn sm" data-f="wrong">Missed</button><button class="btn sm" data-f="flag">Flagged</button>'}
      <button class="btn sm pri" id="rRev">Review in booklet</button></div>
    <div id="secLine" style="color:var(--muted);margin:-4px 0 14px;font-size:.9rem"></div>
    <div class="sheetgrid" id="sheetG"></div>
    ${h.drill?'':'<p class="note">Scale scores use the Pre-ACT’s 1–35 range and count only scored questions, like on test day. Tryout questions are marked and left out. ACT doesn’t publish this form’s conversion table, so it’s estimated from your official report and matches it at your September scores.</p>'}
  </main>`;
  const draw=()=>{const x=h.secs[tab],qs=h.drill||range(1,SECTIONS[tab].n);let gh='';
    if(!h.drill)$('#secLine').textContent=`${SECTIONS[tab].name}: ${x.scale} on the 1–35 scale, ${x.raw} of ${x.n} scored questions right, ${fmt(x.ms)}.`;
    for(const q of qs){const a=x.ans[q],c=key(tab,q),ok=a===c,fl=(x.flags||[]).includes(q);
      if(filter==='wrong'&&ok)continue;if(filter==='flag'&&!fl)continue;
      gh+=`<button class="ans ${ok?'r':'w'}" data-q="${q}" aria-label="Question ${q}, ${ok?'right':'wrong'}"><span class="n">${q}</span><span class="l">You <b>${a||'–'}</b><br>Key <b>${c}</b>${isTry(tab,q)?'<span class="t">tryout</span>':''}${fl?'<span class="t">flagged</span>':''}</span></button>`}
    $('#sheetG').innerHTML=gh||'<p style="color:var(--muted)">Nothing here.</p>';
    $('#sheetG').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>openReview(h,tab,+b.dataset.q));
    P.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===tab)));
    P.querySelectorAll('[data-f]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.f===filter)))};
  $('#rHome').onclick=goHome;
  $('#rRev').onclick=()=>{const x=h.secs[tab],qs=h.drill||range(1,SECTIONS[tab].n);openReview(h,tab,qs.find(i=>x.ans[i]!==key(tab,i))??qs[0])};
  P.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;draw()});
  P.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;draw()});
  draw();scrollTo(0,0);
  if(fresh)countUp($('#bigN'),h.drill?drillRight:big);
}
async function openReview(h,s,q){
  if(!bookBuf){toast('Open your booklet PDF to review in it.');$('#fileIn').click();return}
  R={hist:h,sec:s,q};A=null;show('test');setChrome();if(!await ensureDoc())return;renderQ(true);
}

/* ============ HELPERS ============ */
function show(v){
  view=v;$('#home').hidden=v!=='home';$('#test').hidden=v!=='test';$('#results').hidden=v!=='results';
  if(v!=='test'){if(running)stopClock();closePop();closeTools();if(lrOn)toggleLR();if(hlOn)setHl(false);curPassage=null}
  document.body.style.overflow=v==='test'?'hidden':'';
}
function ask(title,text,yes,no){const d=$('#dlg');
  d.innerHTML=`<h2>${esc(title)}</h2><p>${esc(text)}</p><div class="row">${no?`<button class="btn" value="no">${esc(no)}</button>`:''}<button class="btn pri" value="yes">${esc(yes)}</button></div>`;
  return new Promise(res=>{d.querySelectorAll('button').forEach(b=>b.onclick=()=>{d.close();res(b.value==='yes')});d.oncancel=()=>res(false);d.showModal();d.querySelector('.pri').focus()})}
let toastT;function toast(m){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),3200)}

paintThemeBtn();renderHome();initBook().then(()=>{if(view==='home')renderHome()});
</script>
